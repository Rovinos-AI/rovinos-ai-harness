    <script>
      window.hostileAttack = async ({ call, emit }) => {

              name: "ui.error",
              code: "x".repeat(100 * 1024),
              startOffsetMs: 0,
              durationMs: 0,
            },
          ],
        });

          { name: "ui.error", code: "oversized_batch_blocked", startOffsetMs: 0, durationMs: 0 },
        ]);
      };
    </script>
