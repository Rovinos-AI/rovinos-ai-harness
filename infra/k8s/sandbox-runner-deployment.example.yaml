# Example only: replace the local image and provide a distinct workspace claim for each runner.
apiVersion: v1
kind: Service
metadata:
  name: sandbox-runner
  labels:
    app.kubernetes.io/name: harness
    app.kubernetes.io/component: sandbox-runner
spec:
  selector:
    app.kubernetes.io/name: harness
    app.kubernetes.io/component: sandbox-runner
    app.kubernetes.io/instance: runner-a
  ports:
    - name: runner
      port: 8080
      targetPort: runner
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-runner
  labels:
    app.kubernetes.io/name: harness
    app.kubernetes.io/component: sandbox-runner
    app.kubernetes.io/instance: runner-a
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: harness
      app.kubernetes.io/component: sandbox-runner
      app.kubernetes.io/instance: runner-a
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harness
        app.kubernetes.io/component: sandbox-runner
        app.kubernetes.io/instance: runner-a
    spec:
      containers:
        - name: sandbox-runner
          image: harness:local
          command:
            - setpriv
            - --reuid=10002
            - --regid=10003
            - --clear-groups
            - --inh-caps=+setuid,+setgid,+setpcap
            - --ambient-caps=+setuid,+setgid,+setpcap
            - --
            - node
            - packages/sandbox/dist/runner/src/server.js
          env:
            - name: SANDBOX_ALLOWED_HOSTS
              value: sandbox-runner:8080
            - name: SANDBOX_RUNNER_TOKEN_FILE
              value: /run/secrets/sandbox_runner_token
            - name: SANDBOX_WORKSPACE_ROOT
              value: /workspaces
          ports:
            - name: runner
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: runner
              httpHeaders:
                - name: Host
                  value: sandbox-runner:8080
            periodSeconds: 5
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["SETUID", "SETGID", "SETPCAP"]
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
          volumeMounts:
            - name: workspaces
              mountPath: /workspaces
            - name: runner-token
              mountPath: /run/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: workspaces
          persistentVolumeClaim:
            claimName: harness-runner-a-workspaces
        - name: runner-token
          secret:
            secretName: sandbox-runner-token
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
---
