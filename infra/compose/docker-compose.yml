services:
  harness:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: ${HARNESS_IMAGE:-harness:local}
    command: ["serve"]
    environment:
      HARNESS_DATA_DIR: /tmp/harness
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "dist/bin.js", "--version"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - internal
      - sandbox
  sandbox-runner:
    build:
      context: ../..
      dockerfile: Dockerfile.sandbox
    image: ${HARNESS_SANDBOX_IMAGE:-harness-sandbox:local}
    profiles:
      - sandbox
    environment:
      SANDBOX_RUNNER_TOKEN: ${SANDBOX_RUNNER_TOKEN:?set SANDBOX_RUNNER_TOKEN}
      SANDBOX_ALLOWED_HOSTS: sandbox-runner:8080
      SANDBOX_WORKSPACE_ROOT: /workspaces
    init: true
    # The server retains only SETUID/SETGID/SETPCAP; each command drops all capabilities.
    user: "0:0"
    entrypoint:
      - setpriv
      - --reuid=${SANDBOX_RUNNER_UID:-10002}
      - --regid=${SANDBOX_RUNNER_GID:-10002}
      - --clear-groups
      - --inh-caps=+setuid,+setgid,+setpcap
      - --ambient-caps=+setuid,+setgid,+setpcap
      - --
      - node
      - packages/sandbox/dist/runner/src/server.js
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - SETPCAP
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    cpus: 2.0
    volumes:
      - harness-workspaces:/workspaces
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('node:http').get({ host: '127.0.0.1', port: 8080, path: '/healthz', headers: { host: 'sandbox-runner:8080' } }, (response) => process.exit(response.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 2s
      timeout: 3s
      start_period: 5s
      retries: 10
    networks:
      - sandbox
  otel-collector:
    image: ${OTEL_COLLECTOR_IMAGE:?Set OTEL_COLLECTOR_IMAGE in infra/collector/VERSION}
    command:
      [
        "--config=/etc/otel/base.yaml",
        "--config=/etc/otel/allowlist.generated.yaml",
        "--config=/etc/otel/profile-debug.yaml",
      ]
    mem_limit: 512m
    pids_limit: 256
    volumes:
      - ../collector/base.yaml:/etc/otel/base.yaml:ro
      - ../collector/allowlist.generated.yaml:/etc/otel/allowlist.generated.yaml:ro
      - ../collector/profile-debug.yaml:/etc/otel/profile-debug.yaml:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - internal
      - egress
networks:
  internal:
    internal: true
  sandbox:
    internal: true
  egress: {}
volumes:
  harness-workspaces: {}
