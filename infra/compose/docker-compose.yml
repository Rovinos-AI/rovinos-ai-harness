# SPDX-License-Identifier: Apache-2.0
services:
  harness:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: ${HARNESS_IMAGE:-harness:local}
    command: ["serve"]
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "dist/bin.js", "--version"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
  otel-collector:
    image: ${OTEL_COLLECTOR_IMAGE:?Set OTEL_COLLECTOR_IMAGE in infra/collector/VERSION}
    command: ["--config=/etc/otel/base.yaml", "--config=/etc/otel/profile-debug.yaml"]
    volumes:
      - ../collector/base.yaml:/etc/otel/base.yaml:ro
      - ../collector/profile-debug.yaml:/etc/otel/profile-debug.yaml:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
