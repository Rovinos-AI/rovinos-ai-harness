services:
  egress-probe:
    image: node:22-slim@sha256:c3de60bf2f9dd0ac6370e6117950ff62d6e339527e7472301c9c78a017978392
    command:
      - node
      - -e
      - "require('node:http').createServer((request, response) => { const path = new URL(request.url, 'http://localhost').pathname; if (path === '/redirect-denied') { response.writeHead(302, { location: 'http://denied.example.test/' }); response.end(); return; } if (path === '/redirect-metadata') { response.writeHead(302, { location: 'http://metadata.example.test/latest' }); response.end(); return; } if (path === '/large') { response.writeHead(200, { 'content-type': 'text/plain' }); response.end(Buffer.alloc(2 * 1024 * 1024 + 1, 97)); return; } if (path === '/html') { response.writeHead(200, { 'content-type': 'text/html; charset=utf-8' }); response.end('<h1>visible</h1><div hidden>hidden-canary</div><script>script-canary</script>'); return; } if (path === '/binary') { response.writeHead(200, { 'content-type': 'image/png' }); response.end(Buffer.from([0, 1, 255])); return; } response.writeHead(200, { 'content-type': 'text/plain' }); response.end('probe'); }).listen(8080, '0.0.0.0')"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      egress:
        ipv4_address: 198.51.100.3
        aliases:
          - egress-probe.test
  sandbox-egress-proxy:
    extra_hosts:
      - metadata.example.test:169.254.169.254
networks:
  egress:
    ipam:
      config:
        - subnet: 198.51.100.0/24
