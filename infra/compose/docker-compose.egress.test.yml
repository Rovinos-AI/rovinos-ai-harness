services:
  egress-probe:
    image: node:22-slim@sha256:c3de60bf2f9dd0ac6370e6117950ff62d6e339527e7472301c9c78a017978392
    command:
      - node
      - -e
      - "require('node:http').createServer((_request, response) => response.end('probe')).listen(8080, '0.0.0.0')"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      egress:
        ipv4_address: 198.51.100.3
  sandbox-egress-proxy:
    extra_hosts:
      - metadata.example.test:169.254.169.254
networks:
  egress:
    ipam:
      config:
        - subnet: 198.51.100.0/24
