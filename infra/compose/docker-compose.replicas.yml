services:
  harness:
    extends:
      file: docker-compose.prod-like.yml
      service: harness
    build:
      args:
        WITH_REDIS_RATE_LIMIT: "1"
    depends_on:
      valkey:
        condition: service_healthy
    secrets:
      - rate_limit_redis_url
    deploy:
      replicas: 2
  harness-worker:
    build:
      args:
        WITH_REDIS_RATE_LIMIT: "1"
    depends_on:
      valkey:
        condition: service_healthy
    secrets:
      - rate_limit_redis_url
  valkey:
    image: valkey/valkey:9.1.3-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - internal
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 30s
    cpus: 1
    mem_limit: 256m
secrets:
  rate_limit_redis_url:
    file: ${HARNESS_REDIS_URL_FILE:?Set HARNESS_REDIS_URL_FILE to a file containing the Redis URL}
