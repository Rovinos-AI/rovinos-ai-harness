services:
  harness:
    extends:
      file: docker-compose.yml
      service: harness
    environment:
      HARNESS_CONFIG: /run/harness/control-plane.yaml
    volumes:
      - ../../test/fixtures/control-plane-auth.yaml:/run/harness/control-plane.yaml:ro
    secrets:
      - control_plane_token
    healthcheck:
      test: ["CMD", "node", "dist/bin.js", "healthcheck"]
    depends_on:
      otel-health-wait:
        condition: service_healthy
  otel-collector:
    extends:
      file: docker-compose.yml
      service: otel-collector
    ports:
      - "127.0.0.1::13133"
  otel-health-wait:
    image: ${HARNESS_IMAGE:-harness:local}
    build:
      context: ../..
      dockerfile: Dockerfile
    entrypoint: ["node"]
    command: ["/run/harness/otel-health-wait.mjs"]
    volumes:
      - ../../scripts/collector/otel-health-wait.mjs:/run/harness/otel-health-wait.mjs:ro
    depends_on:
      otel-collector:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "/run/harness/otel-health-wait.mjs", "--check"]
      interval: 2s
      timeout: 2s
      start_period: 70s
      retries: 30
    networks:
      - internal
  presidio-analyzer:
    extends:
      file: docker-compose.yml
      service: presidio-analyzer
  sandbox-runner:
    extends:
      file: docker-compose.yml
      service: sandbox-runner
  sample-mcp-server:
    build:
      context: ../..
      dockerfile: test/fixtures/sample-mcp-server/Dockerfile
    image: sample-mcp-server:local
    environment:
      SAMPLE_COUNTER_FILE: /data/messages.count
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    volumes:
      - sample-mcp-state:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const socket=require('node:net').connect({host:'127.0.0.1',port:3333}); socket.once('connect',()=>{socket.end();process.exit(0)}).once('error',()=>process.exit(1))"
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - internal
  integration-client:
    image: sample-mcp-server:local
    command: ["sleep", "infinity"]
    environment:
      HARNESS_DATA_DIR: /tmp/harness
      SAMPLE_MCP_SERVER_HOST: ${SAMPLE_MCP_SERVER_HOST:-sample-mcp-server}
    volumes:
      - ../../test/mcp-servers.int-client.test.mjs:/app/test/mcp-servers.int-client.test.mjs:ro
      - ../../test/mcp-servers.int-support.mjs:/app/test/mcp-servers.int-support.mjs:ro
      - ../../test/canary/canaries.ts:/app/test/canary/canaries.ts:ro
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "--version"]
    depends_on:
      sample-mcp-server:
        condition: service_healthy
    networks:
      - internal
  postgres:
    image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
    user: postgres
    command: ["postgres", "-c", "unix_socket_directories=/var/run/postgresql"]
    environment:
      POSTGRES_DB: harness
      POSTGRES_USER: harness
      POSTGRES_HOST_AUTH_METHOD: trust
      PGDATA: /tmp/pgdata
    volumes:
      - ./init-vault.sql:/docker-entrypoint-initdb.d/10-vault.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid,nodev
      - /var/run/postgresql:rw,noexec,nosuid,nodev,size=16m,uid=999,gid=999,mode=3775
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - test-host
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "harness", "-d", "harness"]
      interval: 2s
      timeout: 3s
      retries: 30
  valkey:
    image: valkey/valkey:9.1.3-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
    user: valkey
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - test-host
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  kusto-emulator:
    profiles:
      - kusto-contract
    image: mcr.microsoft.com/azuredataexplorer/kustainer-linux:2026.11.12.1414-2645-507a50c-master@sha256:41a19f305682ccee256dd8f7290ddd93219d74e492ba3c476402edd07c33c70e
    environment:
      ACCEPT_EULA: "Y"
    expose:
      - "8080"
    cpus: 2
    mem_limit: 4g
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
      - /kusto/tmp:size=2g,noexec,nosuid,nodev
      - /kustodata:size=1g,noexec,nosuid,nodev
      - /root/Kusto:size=64m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "--silent", "--output", "/dev/null", "http://127.0.0.1:8080"]
      interval: 2s
      timeout: 3s
      start_period: 60s
      retries: 60
    networks:
      - internal
  kusto-test-client:
    profiles:
      - kusto-contract
    image: node:26-slim@sha256:5adad64f9a1fca2d51972caa65983634c8a774eb300d72b20f7f2a0f60368072
    working_dir: /workspace
    environment:
      KUSTO_CLUSTER_URI: http://kusto-emulator:8080
      KUSTO_DATABASE: NetDefaultDB
    command:
      ["node", "--experimental-strip-types", "scripts/kusto/emulator-contract-runner.ts", "--run"]
    volumes:
      - ../../scripts/kusto:/workspace/scripts/kusto:ro
      - ../../infra/kusto:/workspace/infra/kusto:ro
      - ../../packages/schemas:/workspace/packages/schemas:ro
      - ../../test/fixtures/kusto:/workspace/test/fixtures/kusto:ro
      - ../../node_modules:/workspace/node_modules:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "--version"]
    depends_on:
      kusto-emulator:
        condition: service_healthy
    networks:
      - internal
  kusto-query-test-client:
    extends:
      file: docker-compose.test.yml
      service: kusto-test-client
    command:
      [
        "node",
        "--experimental-strip-types",
        "scripts/kusto/emulator-contract-runner.ts",
        "--queries",
      ]
    networks:
      - internal
networks:
  internal:
    internal: true
  sandbox:
    internal: true
  sandbox-egress:
    internal: true
  egress: {}
  # PostgreSQL is not a harness sidecar and is not attached to egress.
  test-host: {}
volumes:
  harness-workspaces: {}
  sample-mcp-state: {}
secrets:
  control_plane_token:
    file: ../../test/fixtures/control-plane-token
