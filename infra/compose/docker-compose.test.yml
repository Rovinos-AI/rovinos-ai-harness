services:
  harness:
    extends:
      file: docker-compose.yml
      service: harness
    healthcheck:
      test: ["CMD", "node", "dist/bin.js", "healthcheck"]
  otel-collector:
    extends:
      file: docker-compose.yml
      service: otel-collector
  sandbox-runner:
    extends:
      file: docker-compose.yml
      service: sandbox-runner
  postgres:
    image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
    user: postgres
    command: ["postgres", "-c", "unix_socket_directories=/var/run/postgresql"]
    environment:
      POSTGRES_DB: harness
      POSTGRES_USER: harness
      POSTGRES_HOST_AUTH_METHOD: trust
      PGDATA: /tmp/pgdata
    volumes:
      - ./init-vault.sql:/docker-entrypoint-initdb.d/10-vault.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql:rw,noexec,nosuid,size=16m,uid=999,gid=999,mode=3775
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - test-host
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "harness", "-d", "harness"]
      interval: 2s
      timeout: 3s
      retries: 30
networks:
  internal:
    internal: true
  sandbox:
    internal: true
  sandbox-egress:
    internal: true
  egress: {}
  # Keep this test-only fixture off the internal network so Docker Desktop and Colima can publish
  # its host port. PostgreSQL is not a harness sidecar and is not attached to egress.
  test-host: {}
volumes:
  harness-workspaces: {}
