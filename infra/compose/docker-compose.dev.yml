# SPDX-License-Identifier: Apache-2.0
services:
  harness:
    profiles: [dev]
    command: ["serve", "--http"]
    environment:
      HARNESS_CONFIG: /run/harness/control-plane.yaml
    volumes:
      - ${CONTROL_PLANE_CONFIG_FILE:-../../test/fixtures/control-plane-empty.yaml}:/run/harness/control-plane.yaml:ro
    secrets:
      - control_plane_token
    stop_grace_period: 30s
    stop_signal: SIGTERM
  otel-collector:
    profiles: [dev]
    command:
      [
        "--config=/etc/otel/base.yaml",
        "--config=/etc/otel/allowlist.generated.yaml",
        "--config=/etc/otel/profile-debug.yaml",
      ]
    ports:
      - "127.0.0.1:4318:4318"
      - "127.0.0.1::13133"
secrets:
  control_plane_token:
    file: ${CONTROL_PLANE_TOKEN_SECRET_FILE:-../../test/fixtures/empty-secret}
