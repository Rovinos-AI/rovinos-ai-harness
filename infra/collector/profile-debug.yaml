# SPDX-License-Identifier: Apache-2.0
exporters:
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors:
        - memory_limiter
        - filter/drop_unregistered_spans
        - filter/drop_span_events
        - transform/span_attributes
        - transform/resource_attributes
        - batch
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors:
        - memory_limiter
        - filter/drop_unregistered_logs
        - transform/log_attributes
        - transform/resource_attributes
        - batch
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors:
        - memory_limiter
        - filter/drop_unregistered_metrics
        - transform/metric_attributes
        - transform/resource_attributes
        - batch
      exporters: [debug]
