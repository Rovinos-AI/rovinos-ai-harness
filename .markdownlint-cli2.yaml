# SPDX-License-Identifier: Apache-2.0
ignores:
  - "**/node_modules/**"
  # Scratch space (for example the quickstart doc-test repository copy); never lint it.
  - ".tmp/**"
config:
  default: true
  MD013: false
  # Changesets repeats "Minor Changes" and "Patch Changes" under each version heading.
  MD024:
    siblings_only: true
  MD033:
    allowed_elements:
      - "!--"
  MD040: true
