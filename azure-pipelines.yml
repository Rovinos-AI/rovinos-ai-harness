# SPDX-License-Identifier: Apache-2.0
# No CI on pushes to main: every change reaches main through a PR whose build already tested the
# merged result (refs/pull/N/merge) and gated the merge. Re-running it on main only spends minutes.
trigger: none

# Draft PRs don't build: Copilot PRs stay drafts through their review and fix rounds and are
# marked ready right before merge, so each PR runs CI when it is ready (and again only if fixed).
pr:
  autoCancel: true
  drafts: false
  branches:
    include:
      - main

# Self-hosted agent (macOS arm64, Docker via Colima) in the project's Default pool: the hosted
# pool's monthly minutes are exhausted. Fork PR builds are disabled at the project level, so
# untrusted code never runs on this agent. Switch back to `vmImage: ubuntu-latest` to use hosted.
pool:
  name: Default

variables:
  YARN_GLOBAL_FOLDER: $(Pipeline.Workspace)/.yarn

stages:
  - stage: static
    jobs:
      - job: static
        steps:
          - checkout: self
            fetchDepth: 0
          - template: pipelines/templates/node-setup.yml
          - script: yarn lint:telemetry
            displayName: Check telemetry schemas and random strings
          - script: yarn docs:catalog --check
            displayName: Check telemetry attribute catalog
          - script: yarn lint
            displayName: Lint
            # Scoped to this step so unit tests never inherit it; they must not depend on the environment.
            env:
              LINT_PULL_IMAGES: "1"
          - script: yarn typecheck
            displayName: Typecheck
          - script: yarn check:agents
            displayName: Check agent index
          - script: yarn check:spdx
            displayName: Check SPDX headers
          - script: yarn check:licenses
            displayName: Check dependency licenses
          - script: yarn check:dco
            displayName: Check DCO sign-offs
            condition: eq(variables['Build.Reason'], 'PullRequest')
            env:
              TARGET_BRANCH: $(System.PullRequest.TargetBranch)

  - stage: unit
    dependsOn: static
    jobs:
      - job: unit
        steps:
          - template: pipelines/templates/node-setup.yml
          - script: >
              yarn test:unit --reporter=junit
              --maxWorkers=4
              --outputFile=reports/junit.xml
              --coverage
              --coverage.reportOnFailure
              --coverage.reporter=cobertura
            displayName: Unit tests
          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: reports/junit.xml
              failTaskOnFailedTests: true
          - task: PublishCodeCoverageResults@2
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: $(System.DefaultWorkingDirectory)/coverage/cobertura-coverage.xml

  - stage: integration
    dependsOn: unit
    jobs:
      - job: integration
        steps:
          - template: pipelines/templates/node-setup.yml
          - bash: scripts/ci/compose-wait.sh
            displayName: Start Compose services and wait for health
          - script: yarn build:schemas
            displayName: Build schemas for worker-thread tests
          - script: >
              yarn test:integration --reporter=junit
              --outputFile=reports/integration-junit.xml
            displayName: Integration tests
            # The container linter fixtures run on a fresh agent, so they must pull the pinned images.
            env:
              TEST_POSTGRES_URL: postgresql://harness@127.0.0.1:5432/harness
              LINT_PULL_IMAGES: "1"
          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: reports/integration-junit.xml
              failTaskOnFailedTests: true
          - bash: |
              mkdir -p "$(Build.ArtifactStagingDirectory)"
              docker compose -f infra/compose/docker-compose.test.yml logs --no-color \
                > "$(Build.ArtifactStagingDirectory)/compose.log"
            condition: failed()
            displayName: Collect Compose logs
          - task: PublishBuildArtifacts@1
            condition: failed()
            inputs:
              PathtoPublish: $(Build.ArtifactStagingDirectory)/compose.log
              ArtifactName: compose-logs
              publishLocation: Container
          - bash: docker compose -f infra/compose/docker-compose.test.yml down -v
            condition: always()
            displayName: Stop Compose services
