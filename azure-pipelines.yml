# SPDX-License-Identifier: Apache-2.0
# No CI on pushes to main: every change reaches main through a PR whose build already tested the
# merged result (refs/pull/N/merge) and gated the merge. Re-running it on main only spends minutes.
trigger: none

# Draft PRs don't build: Copilot PRs stay drafts through their review and fix rounds and are
# marked ready right before merge, so each PR runs CI when it is ready (and again only if fixed).
pr:
  autoCancel: true
  drafts: false
  branches:
    include:
      - main

# Self-hosted agent (macOS arm64, Docker via Colima) in the project's Default pool: the hosted
# pool's monthly minutes are exhausted. Fork PR builds are disabled at the project level, so
# untrusted code never runs on this agent. Switch back to `vmImage: ubuntu-latest` to use hosted.
pool:
  name: Default

variables:
  YARN_GLOBAL_FOLDER: $(Pipeline.Workspace)/.yarn

stages:
  - stage: static
    jobs:
      - job: static
        steps:
          - checkout: self
            fetchDepth: 0
          - template: pipelines/templates/node-setup.yml
          - script: yarn lint:telemetry
            displayName: Check telemetry schemas and random strings
          - script: yarn docs:catalog --check
            displayName: Check telemetry attribute catalog
          - script: yarn gen:collector --check
            displayName: Check Collector allowlist
          - script: yarn lint
            displayName: Lint
            # Scoped to this step so unit tests never inherit it; they must not depend on the environment.
            env:
              LINT_PULL_IMAGES: "1"
          - script: yarn typecheck
            displayName: Typecheck
          - script: yarn build
            displayName: Build packages for policy fixture commands
          - script: node --experimental-strip-types --disable-warning=ExperimentalWarning scripts/compose/validate.ts
            displayName: Validate Compose security profiles
          - script: >
              node packages/cli/dist/bin.js policy test
              --policy examples/policy-tests/policy.yaml
              --calls examples/policy-tests/calls.jsonl
              --expect examples/policy-tests/expectations.jsonl
              --explain
            displayName: Test policy examples
          - script: >
              node packages/cli/dist/bin.js policy lint
              --policy examples/policy-tests/policy.yaml
            displayName: Lint policy examples
          - script: yarn check:agents
            displayName: Check agent index
          - script: yarn check:spdx
            displayName: Check SPDX headers
          - script: yarn check:licenses
            displayName: Check dependency licenses
          - script: yarn check:threat-cases
            displayName: Check sandbox threat test coverage
          - script: yarn check:dco
            displayName: Check DCO sign-offs
            condition: eq(variables['Build.Reason'], 'PullRequest')
            env:
              TARGET_BRANCH: $(System.PullRequest.TargetBranch)

  - stage: unit
    dependsOn: static
    jobs:
      - job: unit
        steps:
          - template: pipelines/templates/node-setup.yml
          - script: >
              yarn test:unit --reporter=junit
              --maxWorkers=4
              --outputFile=reports/junit.xml
              --coverage
              --coverage.reportOnFailure
              --coverage.reporter=cobertura
            displayName: Unit tests
          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: reports/junit.xml
              failTaskOnFailedTests: true
          - task: PublishCodeCoverageResults@2
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: $(System.DefaultWorkingDirectory)/coverage/cobertura-coverage.xml

  - stage: integration
    dependsOn: unit
    jobs:
      - job: integration
        steps:
          - template: pipelines/templates/node-setup.yml
          - bash: scripts/ci/compose-wait.sh
            displayName: Start Compose services and wait for health
          - script: yarn build:schemas
            displayName: Build schemas for worker-thread tests
          - script: yarn build:host
            displayName: Build reference host browser bundle
          - script: yarn workspace @harness/approval-app build
            displayName: Build approval app for the control-plane resource
          # Use the root script: a direct `yarn workspaces foreach` step lacks the root node_modules/.bin on
          # PATH, so workspaces without a local typescript pick up an older global tsc (TS6046).
          - script: yarn build
            displayName: Build packages for Inspector conformance
          - script: yarn workspace @harness/host exec playwright install --with-deps chromium
            displayName: Install Chromium and Linux dependencies
            condition: eq(variables['Agent.OS'], 'Linux')
          - script: yarn workspace @harness/host exec playwright install chromium
            displayName: Install Chromium for macOS host security tests
            condition: ne(variables['Agent.OS'], 'Linux')
          - script: >
              yarn test:integration --reporter=junit
              --outputFile=reports/integration-junit.xml
            displayName: Integration tests
            # The container linter fixtures run on a fresh agent, so they must pull the pinned images.
            env:
              TEST_POSTGRES_URL: postgresql://harness@127.0.0.1:5432/harness
              TEST_VAULT_POSTGRES_URL: postgresql://harness@127.0.0.1:5432/harness_vault
              LINT_PULL_IMAGES: "1"
          - bash: |
              mkdir -p "$(Build.ArtifactStagingDirectory)/playwright-traces"
              if [ -d reports/playwright-traces ]; then
                cp -R reports/playwright-traces/. "$(Build.ArtifactStagingDirectory)/playwright-traces/"
              fi
            condition: failed()
            displayName: Stage Playwright traces on failure
          - task: PublishBuildArtifacts@1
            condition: failed()
            inputs:
              PathtoPublish: $(Build.ArtifactStagingDirectory)/playwright-traces
              ArtifactName: playwright-traces
              publishLocation: Container
          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: reports/integration-junit.xml
              failTaskOnFailedTests: true
          - bash: |
              mkdir -p "$(Build.ArtifactStagingDirectory)"
              docker compose --env-file infra/collector/VERSION \
                -f infra/compose/docker-compose.test.yml logs --no-color \
                > "$(Build.ArtifactStagingDirectory)/compose.log"
            condition: failed()
            displayName: Collect Compose logs
          - task: PublishBuildArtifacts@1
            condition: failed()
            inputs:
              PathtoPublish: $(Build.ArtifactStagingDirectory)/compose.log
              ArtifactName: compose-logs
              publishLocation: Container
          - bash: docker compose --env-file infra/collector/VERSION -f infra/compose/docker-compose.test.yml down -v
            condition: always()
            displayName: Stop Compose services

  - stage: gates
    dependsOn: integration
    jobs:
      - job: gates
        steps:
          - template: pipelines/templates/node-setup.yml
          - script: >
              yarn test:canary --reporter=junit
              --outputFile=reports/canary-junit.xml
            displayName: Canary release gate
          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: reports/canary-junit.xml
              failTaskOnFailedTests: true
