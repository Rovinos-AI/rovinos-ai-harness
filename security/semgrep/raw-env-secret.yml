rules:
  - id: harness.secret-env-outside-resolver
    languages: [javascript, typescript]
    severity: ERROR
    message: Resolve secret references through the config SecretResolver instead of reading secret environment variables directly.
    paths:
      include:
        - /packages/**
      exclude:
        - /packages/config/src/secrets.ts
        - "**/*.test.*"
        - "**/*.int.test.*"
        - "**/*.canary.test.*"
        - "**/*.replay.test.*"
    patterns:
      - pattern-either:
          - pattern: process.env.$KEY
          - pattern: process.env[$KEY]
      - pattern-not-inside: delete process.env.$KEY
      - pattern-not-inside: delete process.env[$KEY]
      - pattern-not-inside: process.env.$KEY = ...
      - pattern-not-inside: process.env[$KEY] = ...
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i).*(secret|token|password|passwd|credential|api.?key|private.?key|access.?key).*
