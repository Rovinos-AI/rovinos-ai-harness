# SPDX-License-Identifier: Apache-2.0
# Shared toolchain setup for every CI job (mirrors pipelines/templates/node-setup.yml): pinned mise
# verified by SHA-256, the mise-pinned Node, Corepack and ShellCheck, the packageManager Yarn, a
# Yarn cache keyed on the lockfile, and an immutable install.
name: Node setup
description: Install the pinned toolchain and the workspace dependencies.
runs:
  using: composite
  steps:
    - name: Install mise
      shell: bash
      run: |
        set -euo pipefail
        MISE_VERSION=v2026.10.4
        MISE_SHA256=2fc793020b442d08163603400236b2c693f8cede810c7e432fc77220e6c9e8a1
        MISE_ARCHIVE="$RUNNER_TEMP/mise-${MISE_VERSION}-linux-x64.tar.gz"
        curl -fsSL \
          "https://github.com/jdx/mise/releases/download/${MISE_VERSION}/mise-${MISE_VERSION}-linux-x64.tar.gz" \
          -o "$MISE_ARCHIVE"
        echo "$MISE_SHA256  $MISE_ARCHIVE" | sha256sum --check --status
        tar -xzf "$MISE_ARCHIVE" -C "$RUNNER_TEMP" mise/bin/mise
        install -D "$RUNNER_TEMP/mise/bin/mise" "$HOME/.local/bin/mise"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Install pinned toolchain
      shell: bash
      run: |
        set -euo pipefail
        mise trust
        mise install
        mise exec -- corepack enable
        echo "$(mise where node)/bin" >> "$GITHUB_PATH"
        echo "$(mise where npm:corepack)/node_modules/.bin" >> "$GITHUB_PATH"
        shellcheck_bin="$(mise which shellcheck)"
        if [ ! -x "$shellcheck_bin" ]; then
          echo "mise did not install the pinned ShellCheck binary."
          exit 1
        fi
        echo "$(dirname "$shellcheck_bin")" >> "$GITHUB_PATH"
        echo "YARN_GLOBAL_FOLDER=$HOME/.yarn-global" >> "$GITHUB_ENV"

    - name: Verify pinned Yarn version
      shell: bash
      run: |
        set -euo pipefail
        expected_yarn_version="$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).packageManager.match(/^yarn@([^+]+)/)?.[1] ?? "")')"
        actual_yarn_version="$(yarn --version)"
        if [ "$actual_yarn_version" != "$expected_yarn_version" ]; then
          echo "Yarn version does not match packageManager."
          exit 1
        fi

    - name: Cache Yarn packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.yarn-global/cache
        key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock', 'mise.toml') }}

    - name: Install dependencies
      shell: bash
      run: yarn install --immutable
