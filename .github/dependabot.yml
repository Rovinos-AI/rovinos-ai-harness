version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    labels:
      - dependencies
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: zod
        update-types:
          - version-update:semver-major
      - dependency-name: "@modelcontextprotocol/*"
        update-types:
          - version-update:semver-major
      - dependency-name: yarn

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    labels:
      - dependencies
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
