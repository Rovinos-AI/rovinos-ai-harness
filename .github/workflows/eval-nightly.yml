# SPDX-License-Identifier: Apache-2.0
name: Nightly eval replay

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: eval-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  eval-replay:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/node-setup
      - name: Build workspace packages
        run: yarn build
      - name: Replay eval suite from cassettes
        run: >
          node packages/cli/dist/bin.js eval run
          examples/evals/suite.ts
          --cassette replay
          --isolation inprocess
          --out reports
      - name: Check eval baseline
        run: >
          node packages/cli/dist/bin.js eval check-baseline
          reports/eval-report.json
          --baseline evals/baseline.json
          --max-drop 0.05
      - name: Upload metadata-only eval report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-report
          path: reports/eval-report.json
          if-no-files-found: warn
          retention-days: 30
