# SPDX-License-Identifier: Apache-2.0
# The only pull request CI, on GitHub-hosted runners, with static, unit, integration, and gates jobs.
#
# No CI on pushes to main: every change reaches main through a PR whose run already tested the
# merged result (the pull_request merge ref). Draft PRs skip every job, so Copilot PRs build only
# once they are marked ready.
#
# Security: runs only on `pull_request` (never `pull_request_target`), with a read-only token and no
# secrets, so fork PRs execute on GitHub's machines without access to anything privileged. The
# repository setting "Require approval for all outside collaborators" gates fork runs behind a
# maintainer (docs/maintainers/branch-protection.md). Every action is pinned to a commit SHA.
name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch: {}
  workflow_call:
    outputs:
      gates:
        description: Result of the required gates job.
        value: ${{ jobs.gates.outputs.result }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.draft }}
  cancel-in-progress: true

jobs:
  static:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/node-setup
      - name: Check Changesets status
        run: |
          yarn build:schemas
          node --experimental-strip-types --disable-warning=ExperimentalWarning scripts/release/check-changeset-required.ts
      - name: Check event schema versions
        run: yarn check:event-schema
      - name: Check telemetry schemas and random strings
        run: yarn lint:telemetry
      - name: Check telemetry attribute catalog
        run: yarn docs:catalog --check
      - name: Check Collector allowlist
        run: yarn gen:collector --check
      - name: Check synthetic PII corpus determinism
        run: yarn check:pii-corpus
      - name: Check documentation claims
        run: yarn lint:claims
      - name: Lint
        run: yarn lint
        # Scoped to this step so unit tests never inherit it; they must not depend on the environment.
        env:
          LINT_PULL_IMAGES: "1"
      - name: Typecheck
        run: yarn typecheck
      - name: Build packages for policy fixture commands
        run: yarn build
      - name: Generate API documentation
        run: yarn docs:api
      - name: Upload API documentation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-docs
          path: docs/api/
          if-no-files-found: error
      - name: Release path dry run
        run: |
          set -euo pipefail
          node --experimental-strip-types --disable-warning=ExperimentalWarning scripts/release/verify-release.ts --dry-run
          for package in sdk cli store-sqlite store-postgres; do
            (cd "packages/$package" && yarn pack --dry-run)
          done
      - name: Validate Compose security profiles
        run: node --experimental-strip-types --disable-warning=ExperimentalWarning scripts/compose/validate.ts
      - name: Test policy examples
        run: >
          node packages/cli/dist/bin.js policy test
          --policy examples/policy-tests/policy.yaml
          --calls examples/policy-tests/calls.jsonl
          --expect examples/policy-tests/expectations.jsonl
          --explain
      - name: Lint policy examples
        run: node packages/cli/dist/bin.js policy lint --policy examples/policy-tests/policy.yaml
      - name: Check agent index
        run: yarn check:agents
      - name: Check SPDX headers
        run: yarn check:spdx
      - name: Check dependency licenses
        run: yarn check:licenses
      - name: Check Semgrep suppression reasons
        run: yarn check:nosemgrep
      - name: Semgrep static analysis
        run: scripts/security/semgrep.sh
      - name: Upload Semgrep report
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep-report
          path: reports/semgrep.json
          if-no-files-found: ignore
      - name: Check sandbox threat test coverage
        run: yarn check:threat-cases
      - name: Check DCO sign-offs
        if: github.event_name == 'pull_request'
        run: yarn check:dco
        env:
          TARGET_BRANCH: ${{ github.base_ref }}
      - name: Secret scan positive controls
        run: yarn test:unit scripts/security
      - name: Scan pull request diff for secrets
        run: scripts/security/secret-scan.sh
      - name: Upload redacted secret scan report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-pull-request-report
          path: reports/security/gitleaks-report.json
          if-no-files-found: ignore
      - name: Install pinned OSV-Scanner
        run: |
          set -euo pipefail
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.3.3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Dependency vulnerability gate
        run: |
          mkdir -p reports
          node --experimental-strip-types --disable-warning=ExperimentalWarning scripts/security/check-vulns.ts --scan > reports/vulnerability-report.json
      - name: Verify vulnerable lockfile positive control
        if: always()
        run: node --experimental-strip-types --disable-warning=ExperimentalWarning scripts/security/check-vulns.ts --positive-control
      - name: Upload dependency vulnerability report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-vulnerability-report
          path: reports/vulnerability-report.json
          if-no-files-found: ignore
      - name: Verify image vulnerability positive control
        if: always()
        run: node --experimental-strip-types --disable-warning=ExperimentalWarning scripts/security/scan-image.ts --positive-control

  image-scan:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/node-setup
      - name: Build images for PR scan and SBOM
        if: github.event_name == 'pull_request' || github.ref_type == 'tag'
        run: |
          set -euo pipefail
          docker buildx create --name ci-image-audit --driver docker-container --use
          docker buildx inspect --bootstrap
          docker buildx build \
            --file Dockerfile \
            --target runtime-os-audit \
            --tag harness-os-audit:pr \
            --provenance=false \
            --output "type=docker,dest=$RUNNER_TEMP/harness-os-audit.tar" \
            .
          docker buildx build \
            --file Dockerfile.sandbox \
            --target runtime-os-audit \
            --tag harness-sandbox-os-audit:pr \
            --provenance=false \
            --output "type=docker,dest=$RUNNER_TEMP/harness-sandbox-os-audit.tar" \
            .
          docker buildx build \
            --file Dockerfile \
            --tag harness:pr \
            --provenance=false \
            --output "type=docker,dest=$RUNNER_TEMP/harness.tar" \
            .
          docker buildx build \
            --file Dockerfile.sandbox \
            --tag harness-sandbox:pr \
            --provenance=false \
            --output "type=docker,dest=$RUNNER_TEMP/harness-sandbox.tar" \
            .
      - name: Generate PR SBOMs and scan images
        if: github.event_name == 'pull_request' || github.ref_type == 'tag'
        env:
          SYFT_IMAGE: anchore/syft:v1.55.0@sha256:4cc92b64ca74ffca4c94d4c8fcc01f217731375300be14d0b6eeb2e82eaa110a
          TRIVY_IMAGE: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
        run: |
          set -euo pipefail
          mkdir -p reports/image-vulnerability

          scan_image() {
            local image_name="$1"
            local image_archive="$RUNNER_TEMP/$image_name.tar"
            local os_image_archive="$RUNNER_TEMP/$image_name-os-audit.tar"
            if ! docker run --rm \
              --volume "$os_image_archive:/image.tar:ro" \
              --volume "$PWD/reports/image-vulnerability:/reports" \
              "$TRIVY_IMAGE" image --input /image.tar --scanners vuln --pkg-types os \
              --list-all-pkgs --format json \
              --output "/reports/$image_name.os.trivy.json" --exit-code 0; then
              return 1
            fi
            if ! node --experimental-strip-types --disable-warning=ExperimentalWarning \
              scripts/security/scan-image.ts \
              --report "reports/image-vulnerability/$image_name.os.trivy.json" \
              --image "$image_name-os-audit" \
              --require-os-packages \
              > "reports/image-vulnerability/$image_name.os.policy.json"; then
              return 1
            fi
            if ! docker run --rm \
              --volume "$image_archive:/image.tar:ro" \
              --volume "$PWD/reports/image-vulnerability:/reports" \
              --env SYFT_CHECK_FOR_APP_UPDATE=false \
              "$SYFT_IMAGE" scan docker-archive:/image.tar \
              --output "cyclonedx-json=/reports/$image_name.cdx.json"; then
              return 1
            fi
            if ! docker run --rm \
              --volume "$image_archive:/image.tar:ro" \
              --volume "$PWD/reports/image-vulnerability:/reports" \
              "$TRIVY_IMAGE" image --input /image.tar --scanners vuln --pkg-types library \
              --format json --output "/reports/$image_name.trivy.json" --exit-code 0; then
              return 1
            fi
            if ! node --experimental-strip-types --disable-warning=ExperimentalWarning \
              scripts/security/scan-image.ts \
              --report "reports/image-vulnerability/$image_name.trivy.json" \
              --image "$image_name" \
              > "reports/image-vulnerability/$image_name.policy.json"; then
              return 1
            fi
          }

          scan_status=0
          scan_image harness || scan_status=1
          scan_image harness-sandbox || scan_status=1
          exit "$scan_status"
      - name: Upload image SBOM and vulnerability reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-sbom-and-vulnerability-reports
          path: reports/image-vulnerability/
          if-no-files-found: ignore

  unit:
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/node-setup
      - name: Build detector packages for the PII report
        run: yarn build
      # Two workers on the 4-vCPU hosted runner, keeping the Mac agent's ratio (4 workers on 10
      # cores). Four workers plus coverage saturate the runner, and CPU-heavy tests (TypeScript
      # emit, type-aware ESLint) then overran their timeouts (#565, #567).
      - name: Unit tests
        run: >
          yarn test:unit
          --reporter=default --reporter=junit
          --outputFile.junit=reports/junit.xml
          --maxWorkers=2
          --coverage
          --coverage.reportOnFailure
          --coverage.reporter=text-summary --coverage.reporter=cobertura
      - name: Regex detector precision and recall report
        run: yarn pii:report --mode regex --out-dir reports/pii-report-regex
      - name: Upload unit reports
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-reports
          path: |
            reports/junit.xml
            reports/pii-report-regex
            coverage/cobertura-coverage.xml
          if-no-files-found: ignore

  integration:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMPOSE_PROJECT_NAME: harness-ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/node-setup
      - name: Build schemas for worker-thread tests
        run: yarn build:schemas
      - name: Start Compose services and wait for health
        run: scripts/ci/compose-wait.sh
      - name: Build reference host browser bundle
        run: yarn build:host
      - name: Build approval app for the control-plane resource
        run: yarn workspace @rovinos/approval-app build
      # Use the root script: a direct `yarn workspaces foreach` step lacks the root node_modules/.bin on
      # PATH, so workspaces without a local typescript pick up an older global tsc (TS6046).
      - name: Build packages for Inspector conformance
        run: yarn build
      - name: Install Chromium and Linux dependencies
        run: yarn workspace @rovinos/host exec playwright install --with-deps chromium
      - name: Integration tests
        run: >
          yarn test:integration
          --reporter=default --reporter=junit
          --outputFile.junit=reports/integration-junit.xml
        # The container linter fixtures run on a fresh runner, so they must pull the pinned images.
        env:
          TEST_POSTGRES_URL: postgresql://harness@127.0.0.1:5432/harness
          TEST_VAULT_POSTGRES_URL: postgresql://harness@127.0.0.1:5432/harness_vault
          LINT_PULL_IMAGES: "1"
      - name: Presidio detector precision and recall report
        if: success() || failure()
        run: yarn pii:report --mode presidio --out-dir reports/pii-report-presidio
      - name: Collect Compose logs
        if: failure()
        run: >
          docker compose --env-file infra/collector/VERSION
          -f infra/compose/docker-compose.test.yml logs --no-color
          > reports/compose.log
      - name: Upload integration reports
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-reports
          path: |
            reports/integration-junit.xml
            reports/pii-report-presidio
            reports/playwright-traces
            reports/compose.log
          if-no-files-found: ignore
      - name: Stop Compose services
        if: always()
        run: docker compose --env-file infra/collector/VERSION -f infra/compose/docker-compose.test.yml down -v --remove-orphans

  gates:
    needs: [integration, image-scan]
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      result: ${{ steps.report-gates-result.outputs.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/node-setup
      - name: Require CI jobs
        if: always()
        env:
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          IMAGE_SCAN_RESULT: ${{ needs.image-scan.result }}
        run: |
          set -euo pipefail
          if [[ "$INTEGRATION_RESULT" != success || "$IMAGE_SCAN_RESULT" != success ]]; then
            exit 1
          fi
      - name: Canary release gate
        run: >
          yarn test:canary
          --reporter=default --reporter=junit
          --outputFile.junit=reports/canary-junit.xml
      - name: Build packages for replay example
        run: yarn build
      - name: Replay regression and documentation example gate
        run: >
          yarn test:replay
          --reporter=default --reporter=junit
          --outputFile.junit=reports/replay-junit.xml
      - name: Upload replay report
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: replay-reports
          path: reports/replay-junit.xml
          if-no-files-found: ignore
      - name: Upload canary report
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canary-reports
          path: reports/canary-junit.xml
          if-no-files-found: ignore
      - name: Report gates result
        if: always()
        id: report-gates-result
        env:
          GATES_RESULT: ${{ job.status }}
        run: echo "result=$GATES_RESULT" >> "$GITHUB_OUTPUT"
