# SPDX-License-Identifier: Apache-2.0
name: Nightly performance budgets

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read

concurrency:
  group: performance-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  performance:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_DB: harness
          POSTGRES_USER: harness
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U harness -d harness"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://harness@127.0.0.1:5432/harness
      COMPOSE_PROJECT_NAME: harness-performance-${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/node-setup
      - name: Build workspace packages
        run: yarn build
      - name: Run long-run soak integration test
        run: yarn test:integration test/soak/long-run.int.test.ts
        env:
          RUN_PERFORMANCE_SOAK: "1"
      - name: Run performance scenarios
        run: yarn bench:run --profile=nightly --output=reports/performance-results.json
      - name: Download previous benchmark artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/performance-baseline"
          previous_run="$(gh run list --workflow performance-nightly.yml --branch main --status completed --limit 1 --json databaseId --jq '.[0].databaseId')"
          if [ -n "$previous_run" ]; then
            gh run download "$previous_run" \
              --name performance-results \
              --dir "$RUNNER_TEMP/performance-baseline" || true
          fi
      - name: Compare absolute and relative performance budgets
        run: |
          baseline="$RUNNER_TEMP/performance-baseline/performance-results.json"
          if [ -f "$baseline" ]; then
            yarn bench:compare \
              --budgets=bench/budgets.json \
              --result=reports/performance-results.json \
              --baseline="$baseline"
          else
            yarn bench:compare \
              --budgets=bench/budgets.json \
              --result=reports/performance-results.json \
              --allow-missing-baseline
          fi
      - name: Upload benchmark result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-results
          path: reports/performance-results.json
          if-no-files-found: warn
          retention-days: 30
